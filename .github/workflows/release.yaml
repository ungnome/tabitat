name: release
on:
  release:
    type:
      - released
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to add release files to
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: determine tag
        id: determine-tag
        env:
          TRIGGER: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ $TRIGGER -eq "release"  ]]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ $TRIGGER -eq "workflow_dispatch" ]]; then
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "could not determine tag"
            exit 1
          fi

      - name: checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.determine-tag.outputs.tag }}

      - name: upload zip
        shell: bash
        env:
          TAG: ${{ steps.determine-tag.outputs.tag }}
        run: |
          mkdir dist
          cd src
          zip -r ../dist/tabitat-${TAG}.zip ./
          gh release upload ${TAG} ../dist/tabitat-${TAG}.zip
