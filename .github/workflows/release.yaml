name: Release
on:
  release:
    type:
      - released

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: create zip
        shell: bash
        run: |
          mkdir dist
          cd src
          zip -r ../dist/tabitat-${TAG}.zip ./

      - name: add zip to release
        shell: bash
        run: |
          gh release upload ${TAG} dist/tabitat-${TAG}.zip
